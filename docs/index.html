<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NavIC Pulse — Constellation</title>
<style>
  :root {
    color-scheme: light;

    --bg:          #FAF7F2;
    --surface:     #FFFDF9;
    --surface-2:   #F1ECE3;
    --rule:        #E6DFD4;
    --rule-soft:   #EFE9E1;

    --ink:         #2A2622;
    --ink-2:       #6A6058;
    --ink-3:       #948A7E;

    --accent:      #A85A38;
    --accent-2:    #C0714F;

    --sage:        #2C7A63;
    --sage-wash:   #E3EEE9;
    --amber:       #BE8722;
    --amber-ink:   #8A5F13;
    --amber-wash:  #F6EBD6;
    --brick:       #A32A1C;
    --brick-wash:  #F6E0DC;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;

    --shadow: 0 1px 2px rgba(42,38,34,.04), 0 1px 10px rgba(42,38,34,.035);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

  .app { max-width: 920px; margin: 0 auto; padding: 26px 20px 108px; }

  /* ---------- header ---------- */
  .masthead { margin-bottom: 24px; }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand h1 { font-size: 26px; line-height: 1.15; letter-spacing: -.02em; margin: 0; font-weight: 600; }
  .brand .screen { font-size: 13px; color: var(--accent); font-weight: 500; }
  .tagline { margin: 7px 0 0; color: var(--ink-2); font-size: 14px; max-width: 58ch; }

  .factbar { display: flex; flex-wrap: wrap; gap: 12px 26px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .fact { display: flex; flex-direction: column; gap: 1px; }
  .fact-v { font-size: 17px; font-weight: 600; }
  .fact-k { font-size: 12px; color: var(--ink-3); }

  .provenance { margin: 14px 0 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.45; }

  /* ---------- explainer ---------- */
  .explainer {
    margin: 22px 0; padding: 18px 18px 16px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow);
  }
  .ex-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 560px) { .ex-cols { grid-template-columns: 1fr; gap: 18px; } }
  .ex-col h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .ex-col h3 .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; vertical-align: 1px; }
  .ex-col p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
  .ex-col .src { display: block; margin-top: 7px; font-size: 12px; color: var(--ink-3); line-height: 1.5; }
  .ex-note {
    margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    font-size: 13px; color: var(--ink-2); line-height: 1.55;
  }
  .ex-note b { color: var(--ink); font-weight: 600; }

  /* ---------- filters ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .fpill {
    font: inherit; font-size: 13px; cursor: pointer;
    padding: 6px 13px; border-radius: 999px;
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2);
    transition: background .12s, color .12s, border-color .12s;
  }
  .fpill:hover { border-color: var(--accent-2); color: var(--ink); }
  .fpill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fpill .c { font-family: var(--mono); font-size: 12px; opacity: .72; margin-left: 6px; }

  /* ---------- legend ---------- */
  .legend {
    display: flex; flex-wrap: wrap; gap: 7px 18px; align-items: center;
    padding: 11px 14px; margin-bottom: 14px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    font-size: 12px; color: var(--ink-2);
  }
  .lg { display: inline-flex; align-items: center; gap: 7px; }
  .lg i { display: inline-block; flex: none; }
  .lg-healthy  { width: 16px; height: 8px; border-radius: 2px; background: var(--sage); }
  .lg-observed { width: 16px; height: 8px; border-radius: 2px; background: var(--amber); }
  .lg-proj     { width: 16px; height: 8px; border-radius: 2px;
                 background: repeating-linear-gradient(90deg, var(--amber) 0 3px, transparent 3px 6px); }
  .lg-detect   { width: 2px; height: 11px; background: var(--amber-ink); }
  .lg-today    { width: 2px; height: 14px; background: var(--ink); }
  .lg-limit    { width: 3px; height: 14px; background: var(--brick); }
  .lg-ci       { width: 16px; height: 4px; border-radius: 2px; background: rgba(190,135,34,.5); }

  /* ---------- cards ---------- */
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden;
    transition: transform .3s cubic-bezier(.2,.7,.3,1), opacity .22s ease,
                box-shadow .18s ease, border-color .18s ease;
  }
  .card.is-open { border-color: #DBD1C3; }
  /* lift on hover, bordered in the card's own status colour */
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 20px rgba(42,38,34,.10), 0 1px 2px rgba(42,38,34,.05);
    border-color: var(--card-accent, var(--rule));
  }
  .card.is-leaving  { opacity: 0; transform: scale(.985); }
  .card.is-entering { opacity: 0; transform: translateY(8px); }

  .card-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    width: 100%; text-align: left; font: inherit; color: inherit;
    background: none; border: 0; padding: 14px 16px 10px; cursor: pointer;
  }
  .card-head:hover .ch-id { color: var(--accent); }
  .card-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .ch-main { display: block; min-width: 0; }
  .ch-right { display: block; flex: none; text-align: right; }
  .ch-id { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .chev { width: 8px; height: 8px; flex: none;
          border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3);
          transform: rotate(45deg) translate(-2px,-2px); transition: transform .16s; }
  .card.is-open .chev { transform: rotate(-135deg) translate(-2px,-2px); }
  .ch-sub { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
  /* ---------- projection readout ---------- */
  .proj { padding: 0 16px; }
  .proj-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .proj-lbl { font-size: 12.5px; color: var(--ink-2); }
  .proj-val { text-align: right; white-space: nowrap; }
  .proj-val .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .proj-val .unit { font-size: 12.5px; color: var(--ink-2); margin-left: 2px; }
  .proj-ci { display: block; margin-top: 1px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .proj-none { font-size: 13px; color: var(--ink-3); }
  .proj-caveat {
    margin-top: 9px; padding-left: 9px; border-left: 2px solid var(--amber);
    font-size: 12.5px; color: var(--ink-2); line-height: 1.45;
  }

  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .pill-normal   { background: var(--sage-wash);  color: var(--sage);      box-shadow: inset 0 0 0 1px rgba(44,122,99,.22); }
  .pill-warning  { background: var(--amber-wash); color: var(--amber-ink); box-shadow: inset 0 0 0 1px rgba(190,135,34,.32); }
  .pill-critical { background: var(--brick-wash); color: var(--brick);     box-shadow: inset 0 0 0 1px rgba(163,42,28,.25); }

  /* ---------- lifetime strip ---------- */
  .stripwrap { padding: 12px 16px 14px; }
  .strip { position: relative; height: 30px; }
  .rail { position: absolute; left: 0; right: 0; top: 11px; height: 9px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
  .seg { position: absolute; top: 0; bottom: 0; }
  .seg-healthy  { background: var(--sage); }
  .seg-observed { background: var(--amber); box-shadow: -2px 0 0 0 var(--surface-2); }
  .seg-proj     { background: repeating-linear-gradient(90deg, var(--amber) 0 3px, transparent 3px 7px); }
  .ci          { position: absolute; top: 22px; height: 4px; min-width: 2px; border-radius: 2px; background: rgba(190,135,34,.5); }
  .tick-detect { position: absolute; top: 2px;  width: 2px; height: 10px; border-radius: 1px; background: var(--amber-ink); transform: translateX(-1px); }
  .mark-today  { position: absolute; top: 5px;  width: 2px; height: 21px; border-radius: 1px; background: var(--ink); transform: translateX(-1px); }
  .mark-today::after { content: ""; position: absolute; left: -2px; top: -4px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .mark-limit  { position: absolute; top: 7px;  width: 3px; height: 17px; border-radius: 1px; background: var(--brick); transform: translateX(-1.5px); }
  .axis { display: flex; justify-content: space-between; margin-top: 3px; font-size: 11px; color: var(--ink-3); }
  .axis .num { font-size: 11px; }

  /* ---------- detail ---------- */
  .detail { border-top: 1px solid var(--rule-soft); background: #FDFAF5; padding: 2px 16px 18px; }
  .dsec { padding-top: 15px; }
  .dsec + .dsec { border-top: 1px solid var(--rule-soft); margin-top: 15px; }
  .dsec h4 { margin: 0 0 9px; font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .02em; }

  .kv { display: grid; grid-template-columns: 1fr auto; gap: 7px 16px; margin: 0; font-size: 13.5px; }
  .kv dt { color: var(--ink-2); }
  .kv dd { margin: 0; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  .kv dd.txt { font-family: var(--sans); font-size: 13.5px; }

  .dnote { margin: 11px 0 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }

  table.chan { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.chan th { text-align: right; font-weight: 500; color: var(--ink-3); font-size: 11.5px; padding: 0 0 6px; }
  table.chan th:first-child { text-align: left; }
  table.chan td { padding: 6px 0; border-top: 1px solid var(--rule-soft); text-align: right;
                  font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
  table.chan td:first-child { text-align: left; font-family: var(--sans); font-size: 13px; color: var(--ink-2); white-space: normal; }
  table.chan td .u { color: var(--ink-3); font-size: 11px; margin-left: 3px; }

  .sevrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .sevbox { flex: 1 1 170px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 9px; background: var(--surface); }
  .sevbox .lbl { font-size: 11.5px; color: var(--ink-3); }
  .sevbox .day { margin-bottom: 7px; font-size: 12px; color: var(--ink-2); font-family: var(--mono); }

  .spark { display: block; width: 100%; height: auto; margin-top: 2px; }

  /* ---------- tooltip ---------- */
  #tip {
    position: fixed; z-index: 60; pointer-events: none; opacity: 0;
    transition: opacity .1s; max-width: 250px;
    background: var(--ink); color: #FDFAF5; font-size: 12px; line-height: 1.45;
    padding: 6px 9px; border-radius: 7px; box-shadow: 0 4px 14px rgba(42,38,34,.22);
  }
  #tip .t { font-weight: 600; }
  #tip .v { font-family: var(--mono); }

  /* ---------- tabs ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: rgba(255,253,249,.96); backdrop-filter: blur(8px);
    border-top: 1px solid var(--rule);
  }
  .tabbar-in { max-width: 920px; margin: 0 auto; display: grid; grid-template-columns: repeat(4,1fr); }
  .tab {
    font: inherit; background: none; border: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 4px calc(9px + env(safe-area-inset-bottom));
    color: var(--ink-3); font-size: 11.5px;
    border-top: 2px solid transparent;
  }
  .tab svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tab:hover { color: var(--ink-2); }
  .tab[aria-selected="true"] { color: var(--accent); border-top-color: var(--accent); }

  /* ---------- panels, shared by the analysis tabs ---------- */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px;
  }
  .panel h3 { margin: 0 0 3px; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .panel .sub { margin: 0 0 11px; font-size: 12.5px; color: var(--ink-3); line-height: 1.45; }
  .panel .cap { margin: 11px 0 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  .panel .cap + .cap { margin-top: 7px; color: var(--ink-3); }
  .chart { display: block; width: 100%; height: auto; }
  .chart + .chart { margin-top: 10px; }

  .keyline {
    margin: 11px 0 0; padding-left: 10px; border-left: 2px solid var(--accent);
    font-size: 13px; color: var(--ink); line-height: 1.5;
  }
  .keyline b { font-weight: 600; }

  .hero { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .hero .v { font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .hero .k { font-size: 13px; color: var(--ink-2); }

  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th {
    text-align: right; font-weight: 500; color: var(--ink-3); font-size: 11.5px;
    padding: 0 0 7px; border-bottom: 1px solid var(--rule); white-space: nowrap;
  }
  table.data th:first-child { text-align: left; }
  table.data td {
    padding: 7px 0; border-bottom: 1px solid var(--rule-soft); text-align: right;
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap;
  }
  table.data td:first-child { text-align: left; font-family: var(--sans); font-size: 13px; color: var(--ink-2); }
  table.data tr:last-child td { border-bottom: 0; }
  table.data td.neg { color: var(--ink-3); }
  table.data + .cap { margin-top: 11px; }
  .tscroll { overflow-x: auto; }

  .clegend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 10px; font-size: 12px; color: var(--ink-2); }
  .clegend span { display: inline-flex; align-items: center; gap: 6px; }
  .clegend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; flex: none; }

  .stub { padding: 72px 0; text-align: center; }
  .stub h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; color: var(--ink-2); }
  .stub p { margin: 0; font-size: 13.5px; color: var(--ink-3); }

  /* ---------- motion ---------- */
  /* Entry: hold at opacity 0 until observed, then run once and drop the class
     so nothing keeps a claim on `transform` (the card hover needs it back). */
  .reveal { opacity: 0; }
  .rise { animation: rise .4s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  .screen { transition: opacity .16s ease; }
  .screen.out { opacity: 0; }

  /* ---------- chart lightbox ---------- */
  svg.chart, svg.spark { cursor: zoom-in; border-radius: 8px; transition: box-shadow .16s ease; }
  svg.chart:hover, svg.spark:hover,
  svg.chart:focus-visible, svg.spark:focus-visible { box-shadow: 0 0 0 2px var(--accent-2); outline: none; }

  #lightbox {
    position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
    padding: 28px 20px; background: rgba(30,26,22,.88);
    opacity: 0; transition: opacity .18s ease;
  }
  #lightbox.on { opacity: 1; }
  .lb-plate {
    background: var(--surface); border-radius: 14px; padding: 20px 22px;
    max-width: 1180px; width: 100%; max-height: 90vh; overflow: auto;
    box-shadow: 0 24px 60px rgba(0,0,0,.42);
    transform: translateY(10px) scale(.99); transition: transform .2s cubic-bezier(.2,.7,.3,1);
  }
  #lightbox.on .lb-plate { transform: none; }
  .lb-cap { font-size: 14px; font-weight: 600; }
  .lb-sub { margin: 3px 0 14px; font-size: 12.5px; color: var(--ink-3); }
  .lb-body svg { display: block; width: 100%; height: auto; cursor: zoom-out; box-shadow: none; }
  .lb-close {
    position: fixed; top: 16px; right: 18px; width: 36px; height: 36px; border-radius: 50%;
    border: 0; background: rgba(253,250,245,.16); color: #FDFAF5;
    font: 400 21px/1 var(--sans); cursor: pointer; transition: background .15s ease;
  }
  .lb-close:hover { background: rgba(253,250,245,.3); }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; }
    .rise { animation: none; }
    .card, .screen, #lightbox, .lb-plate, .fpill, svg.chart, svg.spark { transition: none; }
    .card:hover { transform: none; }
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="app">
  <!-- ==================== CONSTELLATION ==================== -->
  <section id="screen-constellation" class="screen">
    <header class="masthead">
      <div class="brand">
        <h1>NavIC Pulse</h1>
        <span class="screen">Constellation</span>
      </div>
      <p class="tagline" id="tagline"></p>
      <div class="factbar" id="factbar"></div>
      <p class="provenance" id="provenance"></p>
    </header>

    <div class="explainer reveal">
      <div class="ex-cols">
        <div class="ex-col">
          <h3><span class="swatch" style="background:var(--amber)"></span>Status</h3>
          <p id="ex-status"></p>
          <span class="src" id="ex-status-src"></span>
        </div>
        <div class="ex-col">
          <h3><span class="swatch" style="background:var(--brick)"></span>Remaining life</h3>
          <p id="ex-rul"></p>
          <span class="src" id="ex-rul-src"></span>
        </div>
      </div>
      <p class="ex-note"><b>These two are computed independently.</b> <span id="ex-indep"></span></p>
    </div>

    <div class="filters" id="filters"></div>

    <div class="legend reveal">
      <span class="lg"><i class="lg-healthy"></i>Healthy</span>
      <span class="lg"><i class="lg-observed"></i>Observed degradation</span>
      <span class="lg"><i class="lg-proj"></i>Projected</span>
      <span class="lg"><i class="lg-ci"></i>95% interval</span>
      <span class="lg"><i class="lg-detect"></i>Detection</span>
      <span class="lg"><i class="lg-today"></i>Today</span>
      <span class="lg"><i class="lg-limit"></i>Failure limit</span>
    </div>

    <div class="cards" id="cards"></div>
  </section>

  <!-- ==================== EVIDENCE ==================== -->
  <section id="screen-evidence" class="screen" hidden>
    <header class="masthead">
      <div class="brand"><h1>NavIC Pulse</h1><span class="screen">Evidence</span></div>
      <p class="tagline" id="ev-lede"></p>
    </header>
    <div class="filters" id="ev-pills"></div>
    <div class="grid2">
      <div class="panel reveal" id="ev-traj"></div>
      <div class="panel reveal" id="ev-dist"></div>
    </div>
    <div class="panel reveal" id="ev-note"></div>
  </section>

  <!-- ==================== PROGNOSIS ==================== -->
  <section id="screen-prognosis" class="screen" hidden>
    <header class="masthead">
      <div class="brand"><h1>NavIC Pulse</h1><span class="screen">Prognosis</span></div>
      <p class="tagline" id="pr-lede"></p>
    </header>
    <div class="filters" id="pr-pills"></div>
    <div class="panel reveal" id="pr-chart"></div>
    <div class="grid2">
      <div class="panel reveal" id="pr-table"></div>
      <div class="panel reveal" id="pr-note"></div>
    </div>
  </section>

  <!-- ==================== PERFORMANCE ==================== -->
  <section id="screen-performance" class="screen" hidden>
    <header class="masthead">
      <div class="brand"><h1>NavIC Pulse</h1><span class="screen">Performance</span></div>
      <p class="tagline" id="pf-lede"></p>
    </header>
    <div class="grid2">
      <div class="panel reveal" id="pf-roc"></div>
      <div class="panel reveal" id="pf-sat"></div>
    </div>
    <div class="panel reveal" id="pf-detectors"></div>
    <div class="panel reveal" id="pf-head2head"></div>
    <div class="panel reveal" id="pf-persistence"></div>
  </section>
</div>

<div id="tip" role="status" aria-live="polite"></div>

<div id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-cap" hidden>
  <div class="lb-plate">
    <div class="lb-cap" id="lb-cap"></div>
    <p class="lb-sub" id="lb-sub"></p>
    <div class="lb-body" id="lb-body"></div>
  </div>
  <button class="lb-close" id="lb-close" type="button" aria-label="Close">&times;</button>
</div>

<nav class="tabbar" aria-label="Sections">
  <div class="tabbar-in" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-screen="constellation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.6"/><ellipse cx="12" cy="12" rx="10" ry="4.6" transform="rotate(60 12 12)"/></svg>
      Constellation
    </button>

      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15v-4M12 15V8M16 15v-6"/></svg>
      Evidence
    </button>
    <button class="tab" role="tab" aria-selected="false" data-screen="prognosis">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M6.5 10.5l4 3 3-5 4 4"/></svg>
      Prognosis
    </button>
    <button class="tab" role="tab" aria-selected="false" data-screen="performance">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20a8 8 0 1 1 8-8"/><path d="M12 12l4.5-3.5"/><circle cx="12" cy="12" r="1.3"/></svg>
      Performance
    </button>
  </div>
