<script src="data.js"></script>
<script>
(function () {
  "use strict";

  var D = window.NAVIC_PULSE;
  if (!D) { document.getElementById("cards").textContent = "data.js did not load."; return; }

  var META = D.meta, SATS = D.constellation, PROG = D.prognosis, CAL = META.calibration, C = META.counts;

  /* ---------------- formatting ---------------- */

  function fx(v, d) { return v === null || v === undefined ? "—" : Number(v).toFixed(d); }
  function int(v) { return v === null || v === undefined ? "—" : Math.round(v).toLocaleString("en-US"); }

  var SUP = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³",
              4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
  function sup(s) { return String(s).split("").map(function (c) { return SUP[c] || c; }).join(""); }

  function sci(v) {
    if (v === null || v === undefined) return "—";
    var p = Number(v).toExponential(3).split("e");
    return p[0] + "×10" + sup(String(p[1]).replace("+", ""));
  }

  function sig(v, d) {
    if (v === null || v === undefined) return "—";
    var s = Number(v).toPrecision(d);
    if (s.indexOf("e") < 0 && s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
    return s;
  }

  function chanFmt(v, f) {
    if (v === null || v === undefined) return "—";
    if (f === "sci") return sci(v);
    if (f === "fixed1") return fx(v, 1);
    if (f === "fixed2") return fx(v, 2);
    if (f === "fixed4") return fx(v, 4);
    return String(v);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function sevClass(s) { return "pill-" + String(s).toLowerCase(); }

  /* Palette, shared by the cards and every chart. */
  var C_INK = "#2A2622", C_INK2 = "#6A6058", C_INK3 = "#948A7E", C_RULE = "#E6DFD4",
      C_SAGE = "#2C7A63", C_AMBER = "#BE8722", C_AMBERINK = "#8A5F13",
      C_BRICK = "#A32A1C", C_ACCENT = "#A85A38";

  function sevColor(s) {
    return s === "Critical" ? C_BRICK : s === "Warning" ? C_AMBER : C_SAGE;
  }

  var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var HAS_IO = typeof IntersectionObserver === "function";

  /* The projected crossing: the reference day plus the remaining life. */
  function failDay(s) { return s.rul_days === null ? null : s.reference_day + s.rul_days; }

  /* Does the observed signal level ever actually reach the failure limit?
     On every faulted clock here the decline flattens above it, which is the
     limitation the constant-rate projection cannot see. Checked, not assumed. */
  function reachesLimit(s) {
    return Math.min.apply(null, s.signal_sparkline.value) <= PROG.failure_limit;
  }

  /* One horizontal scale for every strip, so the cards are comparable. */
  var AXIS_MAX = META.n_days;
  SATS.forEach(function (s) { var f = failDay(s); if (f !== null && f > AXIS_MAX) AXIS_MAX = f; });
  function pc(day) { return (day / AXIS_MAX * 100).toFixed(3) + "%"; }

  var byId = {};
  SATS.forEach(function (s) { byId[s.id] = s; });

  /* ---------------- header ---------------- */

  document.getElementById("tagline").textContent =
    "Predictive health monitoring for the NavIC rubidium clocks. " + C.satellites +
    " satellites, " + META.years + " years, " + META.cadence + ".";

  document.getElementById("factbar").innerHTML = [
    [C.satellites, "satellites"],
    [C.faulted_satellites, "faulted"],
    [C.healthy_satellites, "healthy"],
    [META.n_days, "days on record"],
    [C.windows, META.window_days + "-day windows"]
  ].map(function (f) {
    return '<div class="fact"><span class="fact-v num" data-count="' + f[0] + '" data-fmt="int">' +
           int(f[0]) + '</span><span class="fact-k">' + esc(f[1]) + "</span></div>";
  }).join("");

  document.getElementById("provenance").textContent = META.provenance;

  /* ---------------- explainer ---------------- */

  document.getElementById("ex-status").textContent =
    "The autoencoder reconstruction error over a " + META.window_days + "-day window, against a fixed threshold of " +
    fx(CAL.threshold, 3) + " — the healthy training mean plus " + fx(CAL.k_sigma, 0) +
    " standard deviations. A fault is declared only after " + CAL.cusum_persistence_windows +
    " consecutive flagged windows, so a single noisy window is never a detection.";
  document.getElementById("ex-status-src").textContent = CAL.note;

  document.getElementById("ex-rul").textContent =
    "Ordinary least squares on the RAFS signal level over the " + PROG.trend_window_days +
    " days ending on the reference day, extrapolated at a constant rate to the " + PROG.failure_limit +
    " failure limit. The crossing standard error is propagated by the delta method.";
  document.getElementById("ex-rul-src").textContent =
    "The reference day is the detection day plus " + PROG.prognosis_lag_days +
    " days — the point at which the call is made. On a clock that was never flagged it is simply the last day on record.";

  document.getElementById("ex-indep").textContent =
    "The autoencoder residual drives detection, not this projection. A clock can be flagged with no declining trend to extrapolate, " +
    "and a declining trend can sit on a clock that was never flagged. Both cases are below.";

  /* ---------------- cohort filter ---------------- */

  var FILTERS = [
    { key: "all",        label: "All",        count: C.satellites,         test: function ()  { return true; } },
    { key: "faulted",    label: "Faulted",    count: C.faulted_satellites, test: function (s) { return s.is_faulted; } },
    { key: "healthy",    label: "Healthy",    count: C.healthy_satellites, test: function (s) { return !s.is_faulted; } },
    { key: "imported",   label: "Imported",   count: C.imported,           test: function (s) { return s.clock_type === "imported"; } },
    { key: "indigenous", label: "Indigenous", count: C.indigenous,         test: function (s) { return s.clock_type === "indigenous"; } }
  ];
  var active = "all";

  var filterEl = document.getElementById("filters");
  filterEl.innerHTML = FILTERS.map(function (f) {
    return '<button class="fpill" type="button" data-f="' + f.key + '" aria-pressed="' +
           (f.key === active) + '">' + esc(f.label) + '<span class="c">' + f.count + "</span></button>";
  }).join("");

  filterEl.addEventListener("click", function (e) {
    var b = e.target.closest(".fpill");
    if (!b) return;
    active = b.dataset.f;
    Array.prototype.forEach.call(filterEl.querySelectorAll(".fpill"), function (p) {
      p.setAttribute("aria-pressed", String(p.dataset.f === active));
    });
    applyFilter(true);
  });

  /* FLIP: measure, swap, invert, play. Cards leaving fade first so the
     survivors are not sliding past something that is still on screen. */
  function applyFilter(animate) {
    var t = FILTERS.filter(function (f) { return f.key === active; })[0].test;
    var cards = Array.prototype.slice.call(document.querySelectorAll(".card"));
    var wants = function (c) { return t(byId[c.dataset.id]); };

    if (!animate || REDUCED) {
      cards.forEach(function (c) { c.hidden = !wants(c); });
      return;
    }

    var leaving = cards.filter(function (c) { return !c.hidden && !wants(c); });
    var firstTop = {};
    cards.forEach(function (c, i) { if (!c.hidden) firstTop[i] = c.getBoundingClientRect().top; });

    function commit() {
      leaving.forEach(function (c) { c.classList.remove("is-leaving"); });
      cards.forEach(function (c) { c.hidden = !wants(c); });

      cards.forEach(function (c, i) {
        if (c.hidden) return;
        if (firstTop[i] === undefined) {
          c.classList.add("is-entering");
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { c.classList.remove("is-entering"); });
          });
          return;
        }
        var dy = firstTop[i] - c.getBoundingClientRect().top;
        if (Math.abs(dy) < 0.5) return;
        c.style.transition = "none";
        c.style.transform = "translateY(" + dy + "px)";
        requestAnimationFrame(function () {
          c.style.transition = "";
          c.style.transform = "";
        });
      });
    }

    if (leaving.length) {
      leaving.forEach(function (c) { c.classList.add("is-leaving"); });
      setTimeout(commit, 170);
    } else {
      commit();
    }
  }

  /* ---------------- entry animation ---------------- */

  var revealObs = HAS_IO && new IntersectionObserver(function (ents) {
    ents.forEach(function (en) {
      if (!en.isIntersecting) return;
      revealObs.unobserve(en.target);
      var el = en.target;
      el.classList.remove("reveal");
      if (REDUCED) return;
      el.classList.add("rise");
      el.addEventListener("animationend", function done() {
        el.classList.remove("rise");
        el.style.animationDelay = "";
        el.removeEventListener("animationend", done);
      });
    });
  }, { threshold: 0.06, rootMargin: "0px 0px -40px 0px" });

  function revealAll(root) {
    Array.prototype.forEach.call(root.querySelectorAll(".reveal"), function (el, i) {
      if (!revealObs) { el.classList.remove("reveal"); return; }
      el.style.animationDelay = Math.min(i, 6) * 35 + "ms";
      revealObs.observe(el);
    });
  }

  /* ---------------- count-up readouts ---------------- */

  function fmtCount(v, fmt) {
    if (fmt === "int") return Math.round(v).toLocaleString("en-US");
    return Number(v).toFixed(parseInt(fmt, 10) || 0);
  }

  function countUp(el) {
    var to = parseFloat(el.dataset.count), fmt = el.dataset.fmt || "int";
    if (isNaN(to)) return;
    if (REDUCED) { el.textContent = fmtCount(to, fmt); return; }
    var t0 = null, dur = 750;
    requestAnimationFrame(function step(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1);
      el.textContent = fmtCount(to * (1 - Math.pow(1 - p, 3)), fmt);
      if (p < 1) requestAnimationFrame(step); else el.textContent = fmtCount(to, fmt);
    });
  }

  var countObs = HAS_IO && new IntersectionObserver(function (ents) {
    ents.forEach(function (en) {
      if (!en.isIntersecting) return;
      countObs.unobserve(en.target);
      countUp(en.target);
    });
  }, { threshold: 0.5 });

  function countAll(root) {
    Array.prototype.forEach.call(root.querySelectorAll("[data-count]"), function (el) {
      var fmt = el.dataset.fmt || "int";
      if (!countObs) { el.textContent = fmtCount(parseFloat(el.dataset.count), fmt); return; }
      el.textContent = fmtCount(0, fmt);
      countObs.observe(el);
    });
  }

  function animateIn(root) { revealAll(root); countAll(root); }

  /* ---------------- lifetime strip ---------------- */

  function strip(s) {
    var h = [], fd = failDay(s);

    h.push('<div class="strip">');
    h.push('<div class="rail">');

    if (s.is_faulted) {
      h.push('<div class="seg seg-healthy" data-tip="Healthy|day 0 – ' + s.anomaly_start_day +
             '" style="left:0;width:' + pc(s.anomaly_start_day) + '"></div>');
      h.push('<div class="seg seg-observed" data-tip="Observed degradation|day ' + s.anomaly_start_day +
             " – " + s.reference_day + ", " + (s.reference_day - s.anomaly_start_day) +
             ' days" style="left:' + pc(s.anomaly_start_day) + ";width:" +
             pc(s.reference_day - s.anomaly_start_day) + '"></div>');
      if (fd !== null) {
        h.push('<div class="seg seg-proj" data-tip="Projected|day ' + s.reference_day + " – " + fd +
               ", " + s.rul_days + ' days remaining" style="left:' + pc(s.reference_day) +
               ";width:" + pc(fd - s.reference_day) + '"></div>');
      }
    } else {
      h.push('<div class="seg seg-healthy" data-tip="Healthy|day 0 – ' + s.last_day +
             ', no fault declared" style="left:0;width:' + pc(s.last_day) + '"></div>');
    }
    h.push("</div>");

    if (s.rul_ci95) {
      var lo = s.reference_day + s.rul_ci95[0], hi = s.reference_day + s.rul_ci95[1];
      h.push('<div class="ci" data-tip="95% interval on the crossing|day ' + lo + " – " + hi +
             ", ±" + fx(s.rul_se_days, 1) + ' d standard error" style="left:' + pc(lo) +
             ";width:" + pc(hi - lo) + '"></div>');
    }
    if (s.detection_day !== null) {
      h.push('<div class="tick-detect" data-tip="Detection|day ' + s.detection_day + ", " +
             s.detection_latency_days + ' days after onset" style="left:' + pc(s.detection_day) + '"></div>');
    }
    h.push('<div class="mark-today" data-tip="Today|day ' + s.reference_day +
           (s.is_faulted ? ", " + PROG.prognosis_lag_days + " days after detection" : ", the last day on record") +
           '" style="left:' + pc(s.reference_day) + '"></div>');
    if (fd !== null) {
      h.push('<div class="mark-limit" data-tip="Failure limit|day ' + fd + ", signal level " +
             PROG.failure_limit + '" style="left:' + pc(fd) + '"></div>');
    }
    h.push("</div>");
    h.push('<div class="axis"><span class="num">day 0</span><span class="num">day ' + AXIS_MAX + "</span></div>");

    return '<div class="stripwrap">' + h.join("") + "</div>";
  }

  /* ---------------- signal-level sparkline ---------------- */

  var SP = { w: 620, h: 136, l: 42, r: 12, t: 12, b: 22, ymin: 0.84, ymax: 1.02 };
  function spx(day) { return SP.l + day / AXIS_MAX * (SP.w - SP.l - SP.r); }
  function spy(v) { return SP.t + (SP.ymax - v) / (SP.ymax - SP.ymin) * (SP.h - SP.t - SP.b); }

  function vline(x, color, w, dash) {
    return '<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + SP.t + '" y2="' + (SP.h - SP.b) +
           '" stroke="' + color + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : "") +
           ' vector-effect="non-scaling-stroke"/>';
  }
  function hline(v, color, w, dash) {
    return '<line x1="' + SP.l + '" x2="' + (SP.w - SP.r) + '" y1="' + spy(v).toFixed(1) + '" y2="' + spy(v).toFixed(1) +
           '" stroke="' + color + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : "") +
           ' vector-effect="non-scaling-stroke"/>';
  }
  function ylabel(v, text, color) {
    return '<text x="' + (SP.l - 7) + '" y="' + (spy(v) + 3.5).toFixed(1) +
           '" text-anchor="end" font-size="10" fill="' + color + '" font-family="ui-monospace,monospace">' + text + "</text>";
  }

  function sparkline(s) {
    var d = s.signal_sparkline, g = [];

    g.push('<svg class="spark" viewBox="0 0 ' + SP.w + " " + SP.h +
           '" role="img" tabindex="0" aria-label="RAFS signal level for ' + esc(s.id) + ' across the whole record">');

    g.push(hline(1, "#E6DFD4", 1));
    g.push(ylabel(1, "1.00", "#948A7E"));
    g.push(hline(PROG.failure_limit, "#A32A1C", 1.5, "5 4"));
    g.push(ylabel(PROG.failure_limit, String(PROG.failure_limit), "#A32A1C"));

    if (s.anomaly_start_day !== null) g.push(vline(spx(s.anomaly_start_day), "#BE8722", 1, "3 3"));
    if (s.detection_day !== null)     g.push(vline(spx(s.detection_day), "#8A5F13", 1.5));
    g.push(vline(spx(s.reference_day), "#2A2622", 1.5));

    var pts = d.day.map(function (day, i) {
      return spx(day).toFixed(1) + "," + spy(d.value[i]).toFixed(1);
    }).join(" ");
    g.push('<polyline points="' + pts + '" fill="none" stroke="#2A2622" stroke-width="1.6" ' +
           'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');

    g.push('<line x1="' + SP.l + '" x2="' + (SP.w - SP.r) + '" y1="' + (SP.h - SP.b) + '" y2="' + (SP.h - SP.b) +
           '" stroke="#E6DFD4" stroke-width="1" vector-effect="non-scaling-stroke"/>');
    g.push('<text x="' + SP.l + '" y="' + (SP.h - 6) +
           '" font-size="10" fill="#948A7E" font-family="ui-monospace,monospace">day 0</text>');
    g.push('<text x="' + (SP.w - SP.r) + '" y="' + (SP.h - 6) +
           '" text-anchor="end" font-size="10" fill="#948A7E" font-family="ui-monospace,monospace">day ' + AXIS_MAX + "</text>");
    g.push("</svg>");

    return g.join("");
  }

  /* ---------------- expanded detail ---------------- */

  function kv(rows) {
    return '<dl class="kv">' + rows.filter(Boolean).map(function (r) {
      return "<dt>" + r[0] + "</dt><dd" + (r[2] ? ' class="txt"' : "") + ">" + r[1] + "</dd>";
    }).join("") + "</dl>";
  }

  function detail(s) {
    var h = [], fd = failDay(s);
    var moved = s.severity_at_reference !== s.severity_at_last_day;

    h.push('<div class="dsec"><h4>Severity</h4><div class="sevrow">');
    h.push('<div class="sevbox"><div class="lbl">At the reference day</div><div class="day">day ' + s.reference_day +
           '</div><span class="pill ' + sevClass(s.severity_at_reference) + '">' + esc(s.severity_at_reference) + "</span></div>");
    h.push('<div class="sevbox"><div class="lbl">At the last day on record</div><div class="day">day ' + s.last_day +
           '</div><span class="pill ' + sevClass(s.severity_at_last_day) + '">' + esc(s.severity_at_last_day) + "</span></div>");
    h.push("</div>");
    h.push('<p class="dnote">' + (s.is_faulted
      ? "The pill on the card reports the reference day — " + PROG.prognosis_lag_days +
        " days after detection, the moment the call was made. The last-day figure is where the same clock had got to " +
        (s.last_day - s.reference_day) + " days later with no intervention" +
        (moved ? ", having crossed from " + s.severity_at_reference + " into " + s.severity_at_last_day + "."
               : ". It held at " + s.severity_at_last_day + " while the anomaly score went on climbing.")
      : "This clock was never flagged, so its reference day is the last day on record and the two readings coincide.") + "</p>");
    h.push("</div>");

    h.push('<div class="dsec"><h4>Anomaly score</h4>');
    h.push(kv([
      ["At the reference day", '<span class="num">' + sig(s.score_at_reference, 4) + "</span>"],
      ["At the last day", '<span class="num">' + sig(s.score_at_last_day, 4) + "</span>"],
      ["Detection threshold", '<span class="num">' + fx(CAL.threshold, 5) + "</span>"],
      ["Critical above", '<span class="num">' + fx(CAL.critical, 2) + "</span>"]
    ]));
    h.push("</div>");

    if (s.is_faulted) {
      h.push('<div class="dsec"><h4>Detection</h4>');
      h.push(kv([
        ["Fault profile", esc(s.profile_label), true],
        ["Onset", '<span class="num">day ' + s.anomaly_start_day + "</span>"],
        ["Declared", '<span class="num">day ' + s.detection_day + "</span>"],
        ["Latency", '<span class="num">' + s.detection_latency_days + " days</span>"],
        ["Reference day", '<span class="num">day ' + s.reference_day + "</span>"]
      ]));
      h.push("</div>");
    }

    h.push('<div class="dsec"><h4>Projected at current decline rate</h4>');
    h.push(kv([
      s.rul_days === null ? ["Projection", esc(s.rul_status), true] : null,
      s.rul_days !== null ? ["Days remaining", '<span class="num">' + s.rul_days + " days</span>"] : null,
      s.rul_ci95 ? ["95% interval", '<span class="num">' + s.rul_ci95[0] + " – " + s.rul_ci95[1] + " days</span>"] : null,
      s.rul_se_days !== null ? ["Standard error", '<span class="num">±' + fx(s.rul_se_days, 1) + " days</span>"] : null,
      fd !== null ? ["Projected crossing", '<span class="num">day ' + fd + "</span>"] : null,
      ["Signal level at reference", '<span class="num">' + fx(s.signal_level_at_reference, 5) + "</span>"],
      ["Trend", '<span class="num">' + sci(s.signal_slope_per_day) + " / day</span>"],
      ["Failure limit", '<span class="num">' + PROG.failure_limit + "</span>"],
      ["Fit window", '<span class="num">' + PROG.trend_window_days + " days</span>"]
    ]));
    h.push("</div>");

    var twoCol = s.reference_day !== s.last_day;
    h.push('<div class="dsec"><h4>Channels</h4><table class="chan"><thead><tr><th>Channel</th>' +
           "<th>Reference day</th>" + (twoCol ? "<th>Last day</th>" : "") + "</tr></thead><tbody>");
    META.channels.forEach(function (ch) {
      var u = ch.unit ? '<span class="u">' + esc(ch.unit) + "</span>" : "";
      h.push("<tr><td>" + esc(ch.label) + "</td>" +
             "<td>" + chanFmt(s.channels_at_reference[ch.key], ch.format) + u + "</td>" +
             (twoCol ? "<td>" + chanFmt(s.channels_at_last_day[ch.key], ch.format) + u + "</td>" : "") + "</tr>");
    });
    h.push("</tbody></table></div>");

    h.push('<div class="dsec"><h4>RAFS signal level across the record</h4>');
    h.push(sparkline(s));
    h.push('<p class="dnote">The projection extrapolates the ' + PROG.trend_window_days +
           "-day trend at a constant rate; this trace is what the channel actually did over all " +
           META.n_days + " days. The dashed red line is the " + PROG.failure_limit + " failure limit" +
           (s.is_faulted ? ", the vertical marks are onset, detection and the reference day. " : ". ") +
           (s.rul_days !== null && !reachesLimit(s)
             ? "The decline flattens at " + fx(Math.min.apply(null, s.signal_sparkline.value), 4) +
               " and never reaches the limit within the record, so the projected crossing on day " +
               failDay(s) + " is not borne out by the trace."
             : "") + "</p>");
    h.push("</div>");

    return '<div class="detail" hidden>' + h.join("") + "</div>";
  }

  /* ---------------- cards ---------------- */

  /* Shortest remaining life first, then the clocks with nothing to project. */
  var ordered = SATS.slice().sort(function (a, b) {
    if (a.is_faulted !== b.is_faulted) return a.is_faulted ? -1 : 1;
    if (a.rul_days !== null && b.rul_days !== null) return a.rul_days - b.rul_days;
    return a.id.localeCompare(b.id);
  });

  function projection(s) {
    var h = ['<div class="proj"><div class="proj-row">',
             '<span class="proj-lbl">Projected at current decline rate</span>'];

    if (s.rul_days !== null) {
      h.push('<span class="proj-val"><span class="v" data-count="' + s.rul_days + '" data-fmt="int">' +
             s.rul_days + '</span><span class="unit">days</span>' +
             (s.rul_ci95 ? '<span class="proj-ci">95% CI ' + s.rul_ci95[0] + "–" + s.rul_ci95[1] + " days</span>" : "") +
             "</span>");
    } else {
      h.push('<span class="proj-val proj-none">' + esc(s.rul_status) + "</span>");
    }
    h.push("</div>");

    if (s.rul_days !== null && !reachesLimit(s)) {
      h.push('<p class="proj-caveat">The observed decline flattens before this limit — see Prognosis.</p>');
    }
    return h.join("") + "</div>";
  }

  document.getElementById("cards").innerHTML = ordered.map(function (s) {
    return '<article class="card reveal" data-id="' + esc(s.id) +
      '" style="--card-accent:' + sevColor(s.severity_at_reference) + '">' +
      '<button class="card-head" type="button" aria-expanded="false">' +
        '<span class="ch-main">' +
          '<span class="ch-id">' + esc(s.id) + '<span class="chev"></span></span>' +
          '<span class="ch-sub">' + esc(s.clock_type_label) + " · " + esc(s.profile_label) + "</span>" +
        "</span>" +
        '<span class="ch-right">' +
          '<span class="pill ' + sevClass(s.severity_at_reference) + '">' + esc(s.severity_at_reference) + "</span>" +
        "</span>" +
      "</button>" +
      projection(s) +
      strip(s) +
      detail(s) +
    "</article>";
  }).join("");

  document.getElementById("cards").addEventListener("click", function (e) {
    var btn = e.target.closest(".card-head");
    if (!btn) return;
    var card = btn.closest(".card");
    var open = btn.getAttribute("aria-expanded") === "true";
    btn.setAttribute("aria-expanded", String(!open));
    card.classList.toggle("is-open", !open);
    card.querySelector(".detail").hidden = open;
  });

  /* ---------------- hover tooltip ---------------- */

  var tip = document.getElementById("tip");
  function hideTip() { tip.style.opacity = "0"; }

  document.addEventListener("mousemove", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
    if (!el) { hideTip(); return; }
    var p = el.dataset.tip.split("|");
    tip.innerHTML = '<span class="t">' + esc(p[0]) + "</span>" +
                    (p[1] ? '<br><span class="v">' + esc(p[1]) + "</span>" : "");
    tip.style.opacity = "1";
    var r = tip.getBoundingClientRect();
    var left = Math.min(Math.max(8, e.clientX - r.width / 2), window.innerWidth - r.width - 8);
    var top = e.clientY - r.height - 14;
    if (top < 8) top = e.clientY + 20;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  });
  document.addEventListener("scroll", hideTip, true);
  window.addEventListener("blur", hideTip);

  /* ================= chart toolkit =================
     Small SVG primitives shared by the three analysis tabs. Everything is a
     plain string; nothing scales strokes, so 1px stays 1px at any width. */

  function f1(v) { return Number(v).toFixed(1); }

  function LN(x1, y1, x2, y2, c, w, dash) {
    return '<line x1="' + f1(x1) + '" y1="' + f1(y1) + '" x2="' + f1(x2) + '" y2="' + f1(y2) +
           '" stroke="' + c + '" stroke-width="' + (w || 1) + '"' +
           (dash ? ' stroke-dasharray="' + dash + '"' : "") + ' vector-effect="non-scaling-stroke"/>';
  }
  function TX(x, y, s, o) {
    o = o || {};
    return '<text x="' + f1(x) + '" y="' + f1(y) + '" font-size="' + (o.size || 10) +
           '" fill="' + (o.fill || C_INK3) + '"' +
           (o.anchor ? ' text-anchor="' + o.anchor + '"' : "") +
           (o.weight ? ' font-weight="' + o.weight + '"' : "") +
           (o.mono ? ' font-family="ui-monospace,monospace"' : "") + ">" + s + "</text>";
  }
  function PLY(pts, c, w, dash) {
    return '<polyline points="' + pts + '" fill="none" stroke="' + c + '" stroke-width="' + w + '"' +
           (dash ? ' stroke-dasharray="' + dash + '"' : "") +
           ' stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  }
  function RC(x, y, w, h, fill, extra) {
    if (w < 0) { x += w; w = -w; }
    return '<rect x="' + f1(x) + '" y="' + f1(y) + '" width="' + f1(Math.max(w, 0)) +
           '" height="' + f1(Math.max(h, 0)) + '" fill="' + fill + '"' + (extra || "") + "/>";
  }
  function DOT(x, y, r, fill) {
    return '<circle cx="' + f1(x) + '" cy="' + f1(y) + '" r="' + r + '" fill="' + fill +
           '" stroke="#FFFDF9" stroke-width="2" vector-effect="non-scaling-stroke"/>';
  }
  function SVG(w, h, label, inner) {
    return '<svg class="chart" viewBox="0 0 ' + w + " " + h + '" role="img" tabindex="0" aria-label="' + esc(label) + '">' +
           inner + "</svg>";
  }

  function lin(d0, d1, r0, r1) { return function (v) { return r0 + (v - d0) / (d1 - d0) * (r1 - r0); }; }
  function lg(d0, d1, r0, r1) {
    var a = Math.log10(d0), b = Math.log10(d1);
    return function (v) { return r0 + (Math.log10(v) - a) / (b - a) * (r1 - r0); };
  }
  function decades(d0, d1) {
    var out = [], e = Math.ceil(Math.log10(d0) - 1e-9), top = Math.floor(Math.log10(d1) + 1e-9);
    for (; e <= top; e++) {
      var v = Math.pow(10, e);
      out.push({ v: v, label: e < 0 ? v.toFixed(-e) : String(Math.round(v)) });
    }
    return out;
  }
  function extent(a) { return [Math.min.apply(null, a), Math.max.apply(null, a)]; }
  function nearestIdx(days, target) {
    var bi = 0, bd = Infinity;
    for (var i = 0; i < days.length; i++) {
      var dd = Math.abs(days[i] - target);
      if (dd < bd) { bd = dd; bi = i; }
    }
    return bi;
  }
  function legend(items) {
    return '<div class="clegend">' + items.map(function (it) {
      var bg = it[2] === "dash"
        ? "repeating-linear-gradient(90deg," + it[1] + " 0 4px,transparent 4px 8px)"
        : it[1];
      return '<span><i style="background:' + bg + '"></i>' + esc(it[0]) + "</span>";
    }).join("") + "</div>";
  }
  function pillRow(items, activeKey) {
    return items.map(function (it) {
      return '<button class="fpill" type="button" data-k="' + it.k + '" aria-pressed="' +
             (it.k === activeKey) + '">' + esc(it.label) +
             (it.note ? '<span class="c">' + esc(it.note) + "</span>" : "") + "</button>";
    }).join("");
  }
  function wirePills(el, onPick) {
    el.addEventListener("click", function (e) {
      var b = e.target.closest(".fpill");
      if (!b) return;
      Array.prototype.forEach.call(el.querySelectorAll(".fpill"), function (p) {
        p.setAttribute("aria-pressed", String(p === b));
      });
      onPick(b.dataset.k);
    });
  }

  /* ================= EVIDENCE ================= */

  var EV_DIST = D.evidence.distribution;
  var evPick = "IRNSS-1I";

  /* Reconstruction error against the threshold, over a day window. */
  function evTraj(s, x0, x1, H, zoomed) {
    var ser = D.evidence.series[s.id].score;
    var W = 470, ml = 44, mr = 12, mt = 14, mb = 26;
    var day = [], val = [];
    for (var i = 0; i < ser.day.length; i++) {
      if (ser.day[i] >= x0 && ser.day[i] <= x1) { day.push(ser.day[i]); val.push(ser.value[i]); }
    }
    if (day.length < 2) return "";

    var thr = CAL.threshold, ex = extent(val);
    var lo = Math.min(ex[0], thr) / 1.8, hi = Math.max(ex[1], thr) * 1.8;
    var X = lin(x0, x1, ml, W - mr), Y = lg(lo, hi, H - mb, mt);
    var g = [];

    decades(lo, hi).forEach(function (d) {
      g.push(LN(ml, Y(d.v), W - mr, Y(d.v), C_RULE, 1));
      g.push(TX(ml - 6, Y(d.v) + 3.5, d.label, { anchor: "end", mono: true }));
    });

    /* the detection threshold */
    g.push(LN(ml, Y(thr), W - mr, Y(thr), C_AMBERINK, 1.5, "5 4"));
    g.push(TX(W - mr, Y(thr) - 5, "threshold " + fx(thr, 3), { anchor: "end", fill: C_AMBERINK, mono: true }));

    if (s.anomaly_start_day !== null && s.anomaly_start_day >= x0 && s.anomaly_start_day <= x1) {
      g.push(LN(X(s.anomaly_start_day), mt, X(s.anomaly_start_day), H - mb, C_AMBER, 1.5, "3 3"));
    }

    g.push(PLY(day.map(function (d, i) { return f1(X(d)) + "," + f1(Y(val[i])); }).join(" "), C_INK, 1.6));

    /* the detection point, annotated with its latency */
    if (s.detection_day !== null && s.detection_day >= x0 && s.detection_day <= x1) {
      var k = nearestIdx(day, s.detection_day);
      var dx = X(day[k]), dy = Y(val[k]);
      g.push(LN(dx, mt, dx, H - mb, C_INK, 1));
      g.push(DOT(dx, dy, 4, C_BRICK));
      if (zoomed) {
        var right = dx < (ml + W - mr) / 2;
        g.push(TX(right ? dx + 9 : dx - 9, Math.max(dy - 10, mt + 10),
                  "detected day " + s.detection_day, { anchor: right ? "start" : "end", fill: C_INK, size: 10.5, weight: 600 }));
        g.push(TX(right ? dx + 9 : dx - 9, Math.max(dy - 10, mt + 10) + 12,
                  s.detection_latency_days + " days after onset", { anchor: right ? "start" : "end", fill: C_INK2, size: 10.5 }));
        g.push(TX(X(s.anomaly_start_day), H - mb + 12, "onset " + s.anomaly_start_day,
                  { anchor: "middle", fill: C_AMBERINK, mono: true }));
      }
    }

    g.push(LN(ml, H - mb, W - mr, H - mb, C_RULE, 1));
    if (!zoomed) {
      [x0, Math.round((x0 + x1) / 2), x1].forEach(function (d, i) {
        g.push(TX(X(d), H - mb + 14, "day " + d, { anchor: i === 0 ? "start" : i === 2 ? "end" : "middle", mono: true }));
      });
    } else {
      g.push(TX(ml, H - 4, "day " + x0, { mono: true }));
      g.push(TX(W - mr, H - 4, "day " + x1, { anchor: "end", mono: true }));
    }
    return SVG(W, H, "Reconstruction error for " + s.id, g.join(""));
  }

  function evDistChart() {
    var W = 470, H = 232, ml = 44, mr = 12, mt = 16, mb = 30;
    var be = EV_DIST.bin_edges, nc = EV_DIST.nominal_counts, ac = EV_DIST.anomalous_counts;
    var ymax = Math.max(Math.max.apply(null, nc), Math.max.apply(null, ac));
    var X = lg(be[0], be[be.length - 1], ml, W - mr), Y = lin(0, ymax, H - mb, mt);
    var g = [];

    [0, 0.25, 0.5, 0.75, 1].forEach(function (t) {
      g.push(LN(ml, Y(t * ymax), W - mr, Y(t * ymax), C_RULE, 1));
      g.push(TX(ml - 6, Y(t * ymax) + 3.5, int(Math.round(t * ymax)), { anchor: "end", mono: true }));
    });

    function area(counts, fill, stroke) {
      var p = [];
      for (var i = 0; i < counts.length; i++) {
        p.push(f1(X(be[i])) + "," + f1(Y(counts[i])), f1(X(be[i + 1])) + "," + f1(Y(counts[i])));
      }
      return '<polygon points="' + f1(ml) + "," + f1(Y(0)) + " " + p.join(" ") + " " +
             f1(X(be[be.length - 1])) + "," + f1(Y(0)) + '" fill="' + fill + '"/>' +
             PLY(p.join(" "), stroke, 1.4);
    }
    g.push(area(nc, "rgba(44,122,99,.20)", C_SAGE));
    g.push(area(ac, "rgba(190,135,34,.24)", C_AMBER));

    var tx = X(EV_DIST.threshold);
    g.push(LN(tx, mt, tx, H - mb, C_INK, 1.5));
    g.push(TX(tx + 6, mt + 9, "threshold " + fx(EV_DIST.threshold, 3), { fill: C_INK, size: 10.5, mono: true }));

    /* direct labels, so the two populations are never identified by colour alone */
    g.push(TX(X(EV_DIST.nominal_mean), mt + 9, "Nominal", { anchor: "end", fill: C_SAGE, size: 11, weight: 600 }));
    g.push(TX(X(EV_DIST.anomalous_mean), mt + 24, "Anomalous", { anchor: "middle", fill: C_AMBERINK, size: 11, weight: 600 }));

    g.push(LN(ml, H - mb, W - mr, H - mb, C_RULE, 1));
    decades(be[0], be[be.length - 1]).forEach(function (d) {
      g.push(LN(X(d.v), H - mb, X(d.v), H - mb + 4, C_INK3, 1));
      g.push(TX(X(d.v), H - mb + 15, d.label, { anchor: "middle", mono: true }));
    });
    g.push(TX((ml + W - mr) / 2, H - 3, "window reconstruction error (log scale)", { anchor: "middle", size: 10.5 }));

    return SVG(W, H, "Distribution of window reconstruction error for the nominal and anomalous populations", g.join(""));
  }

  function renderEvidence() {
    document.getElementById("ev-lede").textContent =
      "What the detector saw, window by window. The score is the autoencoder reconstruction error over a " +
      META.window_days + "-day window; a fault is declared once " + CAL.cusum_persistence_windows +
      " consecutive windows sit above the threshold.";

    document.getElementById("ev-pills").innerHTML = pillRow(SATS.map(function (s) {
      return { k: s.id, label: s.id, note: s.is_faulted ? "faulted" : null };
    }), evPick);
    wirePills(document.getElementById("ev-pills"), function (k) { evPick = k; drawEvidence(); });

    document.getElementById("ev-dist").innerHTML =
      "<h3>Window score distribution</h3>" +
      '<p class="sub">All ' + int(META.counts.windows) + " scored windows, split into the two populations the threshold has to separate.</p>" +
      legend([["Nominal, n=" + int(EV_DIST.nominal_n), C_SAGE], ["Anomalous, n=" + int(EV_DIST.anomalous_n), C_AMBER]]) +
      evDistChart() +
      '<p class="cap"><b>Nominal</b> is ' + esc(EV_DIST.nominal_population) +
      ". <b>Anomalous</b> is every window inside a fault. Nominal mean " + fx(EV_DIST.nominal_mean, 4) +
      ", anomalous mean " + fx(EV_DIST.anomalous_mean, 2) + ".</p>" +
      '<p class="cap">' + esc(EV_DIST.note) + "</p>";

    var P = D.performance;
    document.getElementById("ev-note").innerHTML =
      "<h3>Why detection lags onset</h3>" +
      '<p class="keyline">The ' + P.persistence.windows_required +
      "-window persistence rule is what produces zero false alarms, and it is also what costs the latency. " +
      "The longest unbroken alarm run on any healthy clock is " + P.persistence.healthy_max_run.cusum +
      " windows; the shortest on any faulted clock is " + P.persistence.faulted_min_run.cusum +
      ". A bar at " + P.persistence.windows_required + " sits above every healthy run and far below every faulted one — " +
      "but waiting for it means a fault is always declared after it begins.</p>" +
      '<p class="cap">Across the five faults, detection came ' + P.latency.mean_days + " days after onset on average (" +
      P.latency.min_days + " to " + P.latency.max_days + " days). " + esc(P.latency.note) + "</p>" +
      '<p class="cap">Single flagged windows are common on healthy clocks: ' +
      fx(P.persistence.healthy_single_window_alarm_rate.cusum * 100, 2) +
      "% of their windows cross the threshold at some point. That is why one window is not a detection.</p>";

    drawEvidence();
    animateIn(document.getElementById("screen-evidence"));
  }

  function drawEvidence() {
    var s = byId[evPick];
    var zoom = "";
    if (s.anomaly_start_day !== null) {
      var z0 = Math.max(0, s.anomaly_start_day - 120), z1 = s.detection_day + 150;
      zoom = '<p class="sub" style="margin:14px 0 6px">Onset window, day ' + z0 + " to " + z1 + "</p>" +
             evTraj(s, z0, z1, 168, true);
    } else {
      zoom = '<p class="cap">No fault was declared on this clock. The trace crosses the threshold in short episodes — ' +
             "the longest run is " + runFor(s.id) + " windows, well short of the " +
             CAL.cusum_persistence_windows + " required.</p>";
    }
    document.getElementById("ev-traj").innerHTML =
      "<h3>Reconstruction error · " + esc(s.id) + "</h3>" +
      '<p class="sub">' + esc(s.clock_type_label) + " · " + esc(s.profile_label) +
      ". Log scale; the whole " + META.n_days + "-day record.</p>" +
      legend([["Score", C_INK], ["Threshold", C_AMBERINK, "dash"]].concat(
        s.is_faulted ? [["Onset", C_AMBER, "dash"], ["Detection", C_BRICK]] : [])) +
      evTraj(s, 0, META.n_days, 216, false) +
      zoom;
  }

  function runFor(id) {
    var all = D.performance.persistence.longest_alarm_run;
    var hit = all.healthy.concat(all.faulted).filter(function (r) { return r.id === id; })[0];
    return hit ? hit.cusum : "—";
  }

  /* ================= PROGNOSIS ================= */

  var PR_SATS = PROG.satellites.filter(function (p) { return p.has_projection; });
  var prPick = "IRNSS-1I";

  function prChart(p) {
    var W = 880, H = 330, ml = 52, mr = 118, mt = 18, mb = 34;
    var obs = p.observed;
    var ciLo = p.reference_day + p.rul_ci95[0], ciHi = p.reference_day + p.rul_ci95[1];
    var x0 = obs.day[0], x1 = Math.max(obs.day[obs.day.length - 1], ciHi + 20);
    var vals = obs.value.concat([p.failure_limit, 1.005]);
    var ex = extent(vals);
    var X = lin(x0, x1, ml, W - mr), Y = lin(ex[0] - 0.008, ex[1] + 0.008, H - mb, mt);
    var g = [];

    /* the 90-day window the line was fitted on */
    g.push(RC(X(p.fit_window[0]), mt, X(p.fit_window[1]) - X(p.fit_window[0]), H - mb - mt, "rgba(190,135,34,.10)"));
    g.push(TX((X(p.fit_window[0]) + X(p.fit_window[1])) / 2, mt + 11,
              PROG.trend_window_days + "-day fit", { anchor: "middle", fill: C_AMBERINK, size: 10 }));

    /* the 95% interval on the crossing */
    g.push(RC(X(ciLo), mt, X(ciHi) - X(ciLo), H - mb - mt, "rgba(190,135,34,.22)"));

    [0.86, 0.90, 0.94, 0.98, 1.02].forEach(function (v) {
      if (v < ex[0] - 0.008 || v > ex[1] + 0.008) return;
      g.push(LN(ml, Y(v), W - mr, Y(v), C_RULE, 1));
      g.push(TX(ml - 7, Y(v) + 3.5, v.toFixed(2), { anchor: "end", mono: true }));
    });

    /* the failure limit */
    g.push(LN(ml, Y(p.failure_limit), W - mr, Y(p.failure_limit), C_BRICK, 1.5, "5 4"));
    g.push(TX(W - mr + 8, Y(p.failure_limit) + 3.5, "limit " + p.failure_limit,
              { fill: C_BRICK, size: 10.5, mono: true }));

    /* the observed plateau */
    var pl = p.outcome.observed_plateau_level;
    g.push(LN(X(p.reference_day), Y(pl), W - mr, Y(pl), C_SAGE, 1, "2 3"));
    g.push(TX(W - mr + 8, Y(pl) + 3.5, "plateau " + fx(pl, 3), { fill: C_SAGE, size: 10.5, mono: true }));

    /* observed, split at the day the projection was made */
    var known = [], later = [];
    for (var i = 0; i < obs.day.length; i++) {
      var pt = f1(X(obs.day[i])) + "," + f1(Y(obs.value[i]));
      if (obs.day[i] <= obs.known_through_day) known.push(pt);
      if (obs.day[i] >= obs.known_through_day) later.push(pt);
    }
    g.push(PLY(later.join(" "), C_SAGE, 2));
    g.push(PLY(known.join(" "), C_INK, 1.8));

    /* the fit and its extrapolation */
    g.push(PLY(p.fit_line.day.map(function (d, i) { return f1(X(d)) + "," + f1(Y(p.fit_line.value[i])); }).join(" "), C_AMBER, 2.4));
    g.push(PLY(p.projection.day.map(function (d, i) { return f1(X(d)) + "," + f1(Y(p.projection.value[i])); }).join(" "), C_AMBER, 2, "6 4"));

    /* reference day and the projected crossing */
    g.push(LN(X(p.reference_day), mt, X(p.reference_day), H - mb, C_INK, 1.5));
    g.push(TX(X(p.reference_day), mt - 5, "reference day " + p.reference_day, { anchor: "middle", fill: C_INK, size: 10.5 }));
    g.push(DOT(X(p.crossing_day), Y(p.failure_limit), 4.5, C_AMBERINK));
    g.push(TX(X(p.crossing_day), Y(p.failure_limit) + 18, "projected crossing day " + Math.round(p.crossing_day),
              { anchor: "middle", fill: C_AMBERINK, size: 10.5, weight: 600 }));
    g.push(TX(X(p.crossing_day), Y(p.failure_limit) + 30, "95% CI " + ciLo + "–" + ciHi,
              { anchor: "middle", fill: C_AMBERINK, size: 10, mono: true }));

    g.push(LN(ml, H - mb, W - mr, H - mb, C_RULE, 1));
    g.push(TX(ml, H - mb + 15, "day " + x0, { mono: true }));
    g.push(TX(W - mr, H - mb + 15, "day " + Math.round(x1), { anchor: "end", mono: true }));
    g.push(TX((ml + W - mr) / 2, H - 4, "RAFS signal level", { anchor: "middle", size: 10.5 }));

    return SVG(W, H, "Signal-level projection for " + p.id, g.join(""));
  }

  function renderPrognosis() {
    document.getElementById("pr-lede").textContent =
      "The remaining-life figure on each constellation card, and what the record did afterwards. " +
      "Ordinary least squares on the RAFS signal level over the " + PROG.trend_window_days +
      " days ending on the reference day, extrapolated at a constant rate to the " + PROG.failure_limit + " limit.";

    document.getElementById("pr-pills").innerHTML = pillRow(PR_SATS.map(function (p) {
      return { k: p.id, label: p.id, note: p.rul_days + "d" };
    }), prPick);
    wirePills(document.getElementById("pr-pills"), function (k) { prPick = k; drawPrognosis(); });

    drawPrognosis();
    animateIn(document.getElementById("screen-prognosis"));
  }

  function drawPrognosis() {
    var p = PR_SATS.filter(function (x) { return x.id === prPick; })[0];
    var o = p.outcome;

    document.getElementById("pr-chart").innerHTML =
      "<h3>" + esc(p.id) + " · " + esc(p.profile_label) + "</h3>" +
      '<p class="sub">Projection made on day ' + p.reference_day + ", " + PROG.prognosis_lag_days +
      " days after detection. The record continues past it.</p>" +
      legend([
        ["Observed, known at projection", C_INK],
        ["Fitted decline", C_AMBER],
        ["Extrapolation to the limit", C_AMBER, "dash"],
        ["Observed since", C_SAGE],
        ["Failure limit", C_BRICK, "dash"]
      ]) +
      prChart(p);

    document.getElementById("pr-table").innerHTML =
      "<h3>Numbers</h3>" +
      '<table class="data"><tbody>' +
      [["Reference day", "day " + p.reference_day],
       ["Fit window", "day " + p.fit_window[0] + "–" + p.fit_window[1]],
       ["Level at reference", fx(p.level_at_reference, 5)],
       ["Fitted slope", sci(p.slope_per_day) + " / day"],
       ["Remaining life", p.rul_days + " days"],
       ["95% interval", p.rul_ci95[0] + "–" + p.rul_ci95[1] + " days"],
       ["Standard error", "±" + fx(p.rul_se_days, 1) + " days"],
       ["Projected crossing", "day " + fx(p.crossing_day, 1)],
       ["Reached the limit?", o.crossed_limit ? "yes" : "no"],
       ["Observed plateau", fx(o.observed_plateau_level, 5)],
       ["Lowest level since", fx(o.observed_min_after_reference, 5)]
      ].map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>"; }).join("") +
      "</tbody></table>";

    document.getElementById("pr-note").innerHTML =
      "<h3>How to read this</h3>" +
      '<p class="keyline">Treat the figure as <b>a bound on the decline rate, not a failure date.</b> ' +
      "At the rate measured over the fit window, " + esc(p.id) + " would reach " + p.failure_limit +
      " on day " + Math.round(p.crossing_day) + ". It did not: the level flattened at " +
      fx(o.observed_plateau_level, 3) + " and the lowest it ever reached was " +
      fx(o.observed_min_after_reference, 3) + ".</p>" +
      '<p class="cap">' + esc(o.note) + "</p>" +
      '<p class="cap">The projection is still the operationally useful number — it says how fast the clock is losing ' +
      "margin at the moment the call is made, which is what schedules a review. It is not a prediction that the clock " +
      "stops working on that day.</p>";
  }

  /* ================= PERFORMANCE ================= */

  /* Stated per detector, because the two columns differ. */
  function runRange(which) {
    var r = D.performance.persistence.longest_alarm_run;
    var lab = D.performance.detectors[which].label;
    var h = extent(r.healthy.map(function (x) { return x[which]; }));
    var fl = extent(r.faulted.map(function (x) { return x[which]; }));
    return "Under <b>" + esc(lab) + "</b> " +
           (h[1] === 0 ? "no healthy clock ever crosses the threshold at all"
                       : "healthy clocks run " + h[0] + "–" + h[1] + " windows") +
           " and faulted clocks " + int(fl[0]) + "–" + int(fl[1]) + ".";
  }

  /* The verdict is derived, never asserted: whichever way the matched
     comparison falls, this reports it. Re-runs cannot leave it stale. */
  function detectorVerdict(cu, th) {
    var P = D.performance;
    var h2h = P.comparison.filter(function (c) { return c.cusum_gain_days !== null; });
    var d = cu.window_level.f1 - th.window_level.f1;
    var earlier = h2h.filter(function (c) { return c.cusum_gain_days > 0; }).length;
    var later = h2h.filter(function (c) { return c.cusum_gain_days < 0; }).length;

    var head = (d > 0.002 && earlier > later) ? "CUSUM beat plain thresholding."
             : (d < -0.002 && later > earlier) ? "Plain thresholding beat CUSUM."
             : "CUSUM did not beat plain thresholding.";

    return "<b>" + head + "</b> At a matched false-alarm rate the two are separated by " +
           fx(Math.abs(d), 4) + " of F1 — " +
           int(Math.abs(cu.window_level.true_positives - th.window_level.true_positives)) +
           " windows out of " + int(META.counts.windows) + ". CUSUM declared first on " + earlier +
           " of " + h2h.length + " faults and later on " + later + ", mean " +
           fx(P.cusum_gain.mean_days, 1) + " days. Same windows, same threshold, same persistence " +
           "rule — the comparison is matched, and reported whichever way it comes out.";
  }

  function pfRunChart(which, label) {
    var runs = D.performance.persistence.longest_alarm_run;
    var rows = runs.healthy.map(function (r) { return { id: r.id, v: r[which], faulted: false }; })
      .concat(runs.faulted.map(function (r) { return { id: r.id, v: r[which], faulted: true }; }));
    var W = 434, mt = 24, mb = 32, ml = 66, mr = 14, rowH = 22;
    var H = mt + mb + rows.length * rowH;
    /* Domain follows the data; a run of 0 has no place on a log axis and is
       drawn as a bare label at the origin rather than log10(0) = -Infinity. */
    var top = Math.max(100, Math.max.apply(null, rows.map(function (r) { return r.v; })) * 1.3);
    var X = lg(1, top, ml, W - mr);
    var g = [];

    decades(1, top).forEach(function (d) {
      g.push(LN(X(d.v), mt, X(d.v), H - mb, C_RULE, 1));
      g.push(TX(X(d.v), H - mb + 14, d.label, { anchor: "middle", mono: true }));
    });

    rows.forEach(function (r, i) {
      var y = mt + i * rowH + rowH / 2;
      var zero = !(r.v >= 1);
      var end = zero ? ml : X(r.v);
      g.push(TX(ml - 7, y + 3.5, r.id, { anchor: "end", size: 10.5, fill: C_INK2 }));
      if (!zero) {
        g.push(RC(ml, y - 5, Math.max(end - ml, 1.5), 10, r.faulted ? C_AMBER : C_SAGE, ' rx="2"'));
      }
      g.push(TX(end + 6, y + 3.5, zero ? "0" : int(r.v),
                { size: 10, mono: true, fill: zero ? C_INK3 : C_INK2 }));
    });

    var bx = X(D.performance.persistence.windows_required);
    g.push(LN(bx, mt - 8, bx, H - mb, C_BRICK, 2));
    g.push(TX(bx, mt - 12, "60", { anchor: "middle", fill: C_BRICK, size: 10.5, weight: 600, mono: true }));
    g.push(TX((ml + W - mr) / 2, H - 4, "longest unbroken alarm run, windows (log scale)", { anchor: "middle", size: 10.5 }));

    return SVG(W, H, label + " alarm run lengths", g.join(""));
  }

  function pfGainChart() {
    var rows = D.performance.comparison.filter(function (c) { return c.cusum_gain_days !== null; });
    var W = 880, mt = 16, mb = 34, ml = 78, mr = 44, rowH = 26;
    var H = mt + mb + rows.length * rowH;
    /* Domain spans the actual gains, always including zero so the sign reads. */
    var gains = rows.map(function (r) { return r.cusum_gain_days; });
    var g0 = Math.min(0, Math.min.apply(null, gains)), g1 = Math.max(0, Math.max.apply(null, gains));
    var pad = Math.max(2, Math.ceil((g1 - g0) * 0.18));
    var d0 = g0 - pad, d1 = g1 + pad;
    var step = (d1 - d0) <= 12 ? 2 : (d1 - d0) <= 30 ? 5 : 10;
    var X = lin(d0, d1, ml, W - mr);
    var g = [];

    for (var t = Math.ceil(d0 / step) * step; t <= d1; t += step) {
      g.push(LN(X(t), mt, X(t), H - mb, C_RULE, 1));
      g.push(TX(X(t), H - mb + 14, (t > 0 ? "+" : "") + t, { anchor: "middle", mono: true }));
    }
    g.push(LN(X(0), mt, X(0), H - mb, C_INK3, 1.5));

    rows.forEach(function (r, i) {
      var y = mt + i * rowH + rowH / 2;
      g.push(TX(ml - 8, y + 3.5, r.id, { anchor: "end", size: 10.5, fill: C_INK2 }));
      g.push(RC(X(0), y - 6, X(r.cusum_gain_days) - X(0), 12, r.cusum_gain_days > 0 ? C_ACCENT : C_INK3, ' rx="2"'));
      var end = X(r.cusum_gain_days);
      g.push(TX(r.cusum_gain_days > 0 ? end + 6 : end - 6, y + 3.5,
                (r.cusum_gain_days > 0 ? "+" : "") + r.cusum_gain_days + " d",
                { anchor: r.cusum_gain_days > 0 ? "start" : "end", size: 10, mono: true, fill: C_INK2 }));
    });
    g.push(TX((ml + W - mr) / 2, H - 4, "days CUSUM declared before the plain threshold (negative = later)",
              { anchor: "middle", size: 10.5 }));

    return SVG(W, H, "CUSUM lead over plain thresholding, per fault", g.join(""));
  }

  function renderPerformance() {
    var P = D.performance, cu = P.detectors.cusum, th = P.detectors.threshold;

    document.getElementById("pf-lede").textContent =
      "How the detector scores, and what happened when we put CUSUM against plain thresholding on the same data " +
      "with the same persistence rule.";

    document.getElementById("pf-roc").innerHTML =
      "<h3>Ranking quality</h3>" +
      '<div class="hero"><span class="v" data-count="' + P.roc_auc + '" data-fmt="4">' + P.roc_auc +
      '</span><span class="k">ROC AUC, window level</span></div>' +
      '<p class="cap">' + esc(P.roc_auc_note) + "</p>";

    document.getElementById("pf-sat").innerHTML =
      "<h3>Satellite level</h3>" +
      '<div class="hero"><span class="v">' + cu.satellite_level.faulted_caught + "/" + cu.satellite_level.faulted_total +
      '</span><span class="k">faults caught</span><span class="v">' + cu.satellite_level.healthy_false_alarms + "/" +
      cu.satellite_level.healthy_total + '</span><span class="k">healthy clocks falsely alarmed</span></div>' +
      '<p class="cap">Both detectors reach the same satellite-level result: every fault found, nothing raised on a healthy clock.</p>';

    function drow(label, d) {
      return "<tr><td>" + label + "</td><td>" + fx(d.precision, 4) + "</td><td>" + fx(d.recall, 4) +
             "</td><td>" + fx(d.f1, 4) + "</td><td>" + int(d.true_positives) + "</td><td>" +
             int(d.false_positives) + "</td><td>" + int(d.false_negatives) + "</td><td>" +
             int(d.true_negatives) + "</td></tr>";
    }
    document.getElementById("pf-detectors").innerHTML =
      "<h3>Window-level scores, both detectors</h3>" +
      '<p class="sub">Same windows, same threshold, same ' + P.persistence.windows_required +
      "-window persistence rule — a matched comparison.</p>" +
      '<div class="tscroll"><table class="data"><thead><tr><th>Detector</th><th>Precision</th><th>Recall</th>' +
      "<th>F1</th><th>TP</th><th>FP</th><th>FN</th><th>TN</th></tr></thead><tbody>" +
      drow(cu.label, cu.window_level) + drow(th.label, th.window_level) +
      "</tbody></table></div>" +
      '<p class="keyline">' + detectorVerdict(cu, th) + "</p>";

    var h2h = P.comparison.filter(function (c) { return c.onset_day !== null; });
    document.getElementById("pf-head2head").innerHTML =
      "<h3>Head to head, per fault</h3>" +
      '<p class="sub">Detection day and latency for each detector, and the days between them.</p>' +
      '<div class="tscroll"><table class="data"><thead><tr><th>Satellite</th><th>Onset</th>' +
      "<th>Threshold day</th><th>Threshold latency</th><th>CUSUM day</th><th>CUSUM latency</th><th>CUSUM lead</th>" +
      "</tr></thead><tbody>" +
      h2h.map(function (c) {
        return "<tr><td>" + esc(c.id) + "</td><td>" + c.onset_day + "</td><td>" + c.threshold_detection_day +
               "</td><td>" + c.threshold_latency_days + " d</td><td>" + c.cusum_detection_day + "</td><td>" +
               c.cusum_latency_days + " d</td><td" + (c.cusum_gain_days > 0 ? "" : ' class="neg"') + ">" +
               (c.cusum_gain_days > 0 ? "+" : "") + c.cusum_gain_days + " d</td></tr>";
      }).join("") +
      "</tbody></table></div>" +
      pfGainChart() +
      '<p class="cap">Mean lead ' + fx(P.cusum_gain.mean_days, 1) + " days, range " + P.cusum_gain.min_days +
      " to " + P.cusum_gain.max_days + " days. CUSUM was the later of the two on " +
      h2h.filter(function (c) { return c.cusum_gain_days < 0; }).length + " of " + h2h.length + " faults.</p>" +
      '<p class="cap">' + esc(P.cusum_gain.note) + "</p>";

    document.getElementById("pf-persistence").innerHTML =
      "<h3>What the persistence rule is doing</h3>" +
      '<p class="sub">Longest unbroken run of flagged windows per clock. The bar at ' +
      P.persistence.windows_required + " is the declaration rule.</p>" +
      legend([["Healthy clock", C_SAGE], ["Faulted clock", C_AMBER]]) +
      '<div class="grid2">' +
      "<div><p class=\"sub\" style=\"margin-bottom:4px\">" + esc(cu.label) + "</p>" + pfRunChart("cusum", cu.label) + "</div>" +
      "<div><p class=\"sub\" style=\"margin-bottom:4px\">" + esc(th.label) + "</p>" + pfRunChart("threshold", th.label) + "</div>" +
      "</div>" +
      '<p class="keyline">' + runRange("cusum") + " " + runRange("threshold") +
      " Nothing lands between the two populations under either detector, which is why a bar on run length " +
      "separates them where a bar on a single window cannot.</p>" +
      '<p class="cap">' + esc(P.persistence.note) + "</p>";

    animateIn(document.getElementById("screen-performance"));
  }

  /* ================= chart lightbox ================= */

  var LB = document.getElementById("lightbox"), lbReturn = null;

  function openLightbox(svg) {
    if (!LB.hidden) return;
    var host = svg.closest(".panel") || svg.closest(".card");
    var title = host && host.querySelector("h3, .ch-id");
    var near = svg.previousElementSibling;
    while (near && !/^(H3|H4|P)$/.test(near.tagName)) near = near.previousElementSibling;

    document.getElementById("lb-cap").textContent =
      (near && near.tagName === "H4" ? near.textContent
        : title ? title.textContent : "Chart").replace(/\s+/g, " ").trim();
    document.getElementById("lb-sub").textContent = svg.getAttribute("aria-label") || "";

    var body = document.getElementById("lb-body");
    body.innerHTML = "";
    var clone = svg.cloneNode(true);
    clone.removeAttribute("tabindex");
    body.appendChild(clone);

    lbReturn = document.activeElement;
    LB.hidden = false;
    document.body.style.overflow = "hidden";
    hideTip();
    requestAnimationFrame(function () { LB.classList.add("on"); });
    document.getElementById("lb-close").focus();
  }

  function closeLightbox() {
    if (LB.hidden) return;
    LB.classList.remove("on");
    document.body.style.overflow = "";
    var finish = function () {
      LB.hidden = true;
      document.getElementById("lb-body").innerHTML = "";
    };
    if (REDUCED) finish(); else setTimeout(finish, 180);
    if (lbReturn && lbReturn.focus) lbReturn.focus();
    lbReturn = null;
  }

  document.addEventListener("click", function (e) {
    if (!LB.hidden) return;                       /* the overlay handles its own clicks */
    if (!e.target.closest) return;
    var svg = e.target.closest("svg.chart, svg.spark");
    if (svg) openLightbox(svg);
  });

  LB.addEventListener("click", closeLightbox);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeLightbox(); return; }
    var a = document.activeElement;
    if ((e.key === "Enter" || e.key === " ") && a && a.matches && a.matches("svg.chart, svg.spark")) {
      e.preventDefault();
      openLightbox(a);
    }
  });

  /* ================= tabs ================= */

  var SCREENS = ["constellation", "evidence", "prognosis", "performance"];
  var RENDERED = {};
  var RENDERERS = { evidence: renderEvidence, prognosis: renderPrognosis, performance: renderPerformance };
  var current = "constellation";

  function activate(want) {
    if (want === current) return;
    var curEl = document.getElementById("screen-" + current);
    var nxEl = document.getElementById("screen-" + want);

    function swap() {
      if (RENDERERS[want] && !RENDERED[want]) { RENDERERS[want](); RENDERED[want] = true; }
      SCREENS.forEach(function (k) { document.getElementById("screen-" + k).hidden = k !== want; });
      curEl.classList.remove("out");
      current = want;
      window.scrollTo(0, 0);
      if (REDUCED) return;
      nxEl.classList.add("out");
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { nxEl.classList.remove("out"); });
      });
    }

    if (REDUCED) { swap(); return; }
    curEl.classList.add("out");
    setTimeout(swap, 160);
  }

  var tabsEl = document.querySelector(".tabbar-in");
  tabsEl.addEventListener("click", function (e) {
    var b = e.target.closest(".tab");
    if (!b) return;
    var want = b.dataset.screen;
    Array.prototype.forEach.call(tabsEl.querySelectorAll(".tab"), function (t) {
      t.setAttribute("aria-selected", String(t.dataset.screen === want));
    });
    activate(want);
    hideTip();
  });

  applyFilter(false);
  animateIn(document.getElementById("screen-constellation"));
})();
</script>
</body>
</html>
